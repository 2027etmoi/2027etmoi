[build]
  publish = "."
  command = "python3 scripts/build.py"

[build.environment]
  PYTHON_VERSION = "3.11"

# Cache long pour les fichiers versionnés (?v=empreinte), court pour les pages et les données
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
