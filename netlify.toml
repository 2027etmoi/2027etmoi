[build]
  publish = "."
  command = "python3 scripts/build.py"

[build.environment]
  PYTHON_VERSION = "3.11"

# Les liens internes gardent leur extension : une seule adresse par page, celle que
# déclarent la balise canonique et le plan du site. Sans cela, Netlify réécrit tous
# les liens en supprimant « .html », et chaque page devient accessible à deux adresses.
[build.processing.html]
  pretty_urls = false

# Cache long pour les fichiers versionnés (?v=empreinte), court pour les pages et les données
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Une seule adresse indexable : l'adresse Netlify renvoie vers le domaine
[[redirects]]
  from = "https://2027etmoi.netlify.app/*"
  to = "https://2027etmoi.fr/:splat"
  status = 301
  force = true

# Le domaine .com est un alias du site : sans redirection, il en servait une copie
# complète (code 200), que Google explorait comme un second site.
[[redirects]]
  from = "https://2027etmoi.com/*"
  to = "https://2027etmoi.fr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.2027etmoi.com/*"
  to = "https://2027etmoi.fr/:splat"
  status = 301
  force = true
